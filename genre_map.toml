# genre_map.toml: mappa dai generi/tag fini ai macro-generi usati per le playlist.
#
# Formato: "Nome Macro-Genere" = ["tag1", "tag2", ...]
# - I tag sono case-insensitive e possono usare trattini o spazi indifferentemente.
# - Il nome del macro-genere stesso è sempre riconosciuto automaticamente.
# - I tag non elencati qui finiscono nel report di `sch genres-report` per aggiornare la mappa.
# - L'ordine delle sezioni determina la priorità in caso di match parziale ugualmente lungo.
#
# Modifica liberamente: aggiungi tag che compaiono nel report dei generi non mappati.

